# 웹서버(클라우드 서버)용 구성: Caddy(HTTPS) → 출결 앱
# 사설 DB(Supabase)는 서버에 설치한 Tailscale 을 통해 100.x 주소로 접속한다.
#
#   cd deploy && cp ../.env.example .env  (값 수정) && DOMAIN=attend.example.com docker compose up -d --build
services:
  app:
    build: ..
    env_file: .env
    environment:
      CLIENT_IP_HEADER: x-real-ip
    restart: unless-stopped
    # 외부 포트를 열지 않는다. Caddy 만 접근하므로 X-Real-IP 위조가 불가능하다.
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 을 지정해 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
